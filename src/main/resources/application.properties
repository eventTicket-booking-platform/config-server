spring.application.name=config-server
server.port=8888

spring.profiles.active=${SPRING_PROFILES_ACTIVE:git}
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:file:///E:/__update_projects/EventBookingSystem/backend/config-repo}
spring.cloud.config.server.git.default-label=${CONFIG_GIT_LABEL:main}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.force-pull=true
spring.cloud.config.server.git.username=${CONFIG_GIT_USERNAME:}
spring.cloud.config.server.git.password=${CONFIG_GIT_PASSWORD:}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,env
